<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymTracker - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="contenedor-login">
        <section class="tarjeta-login">
            <h1>GymTracker</h1>
            <p class="subtitulo-login">Inicia sesión para continuar</p>

            <form id="formLogin">
                <div class="grupo-formulario">
                    <label for="correo"> Correo electrónico</label>
                    <input type="email" id="correo" placeholder="Introduce tu correo" required> 
                </div>

                <div class="grupo-formulario">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" placeholder="Introduce tu corntraseña" required>
                </div>

                <button type="submit">Iniciar sesión</button>
            </form>

            <p id="mensajeLogin" class="mensaje-login"></p>

            
            <div class="enlaces-login">
            <p>¿No tienes cuenta?</p>  
            <a class="parrafoCrear" href="register.html">Crear Cuenta</a>
            </div>
            
        </section>

        <p class="mensajeMotivador">Transforma tu cuerpo, supera tus límites</p>
    </main>

    <script type="module" src="js/pages/login.js"></script>

</body>
</html>
