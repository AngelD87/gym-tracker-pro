<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymTracker Entrenamiento</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <header class="header-principal">
        <div class="logo-header">GymTracker</div>
        <button id="btnVolverDashboard" class="boton-salir">Volver</button>
    </header>

    <main class="contenido-dashboard">
        <section class="tarjeta-dashboard">
            <h1 id="tituloEntrenamiento">Entrenamiento</h1>
            <p id="infoEntrenamiento">Cargando entrenamiento...</p>
        </section>

        <section class="tarjeta-dashboard tarjeta-accion">
            <h2>Gestiona tu entrenamiento</h2>
            <button id="btnAñadirEjercicio" class="boton-principal">Añadir Ejercicio</button>
        </section>

        <section class="tarjeta-dashboard">
            <h2>Ejercicios del entrenamiento</h2>
            <div id="listaEjerciciosEntrenamiento">
                <p>No hay ejercicios añadidos todavía</p>
            </div>
        </section>

        <section class="tarjeta-dashboard tarjeta-accion">
            <h2>Finalizar Sesión</h2>
            <button id="btnCerrarEntrenamiento" class="boton-principal">Cerrar Entrenamiento</button>
        </section>

    </main>

    <nav class="nav-inferior">
        <a href="../dashboard.html" class="item-nav">
            <img src="../images/icons/inicio.png" alt="Inicio" class="icono-nav">
            <span>Inicio</span>
        </a>

        <a href="ejercicios.html" class="item-nav">
            <img src="../images/icons/nav-ejercicios.png" alt="Ejercicios" class="icono-nav">
            <span>Ejercicios</span>
        </a>

        <a href="entrenamientos.html" class="item-nav activo">
            <img src="../images/icons/nav-entrenos.png" alt="Entrenos" class="icono-nav">
            <span>Entrenos</span>
        </a>

        <a href="perfil.html" class="item-nav">
            <img src="../images/icons/nav-perfil.png" alt="Perfil" class="icono-nav">
            <span>Perfil</span>
        </a>
    </nav>

    <!-- MODAL AÑADIR EJERCICIO -->
    <div id="modalEjercicio" class="modal oculto">
        <div class="modal-contenido">
            <h2>Añadir Ejercicio</h2>

        <!--SELECCIONAR MUSCULO-->
        <div class="grupo-formulario">
            <label for="selectMusculo">Grupo muscular</label>
            <select id="selectMusculo" class="input-modal">
                <option value="">Selecciona un músculo</option>
            </select>
        </div>

        <!--SELECCIONAR EJERCICIO-->
            <div class="grupo-formulario">
                <label for="selectEjercicio">Ejercicio</label>
                <select id="selectEjercicio" class="input-modal">
                    <option value="">Selecciona un ejercicio</option>
                </select>
            </div>

            <!--INFO EJERCICIO-->
            <div id="infoEjercicio" class="tarjeta-ejercicio oculto">
                <h3 id="nombreEjercicioInfo"></h3>
                <p id="descripcionEjercicioInfo"></p>

                <button id="btnVerVideo" class="boton-principal">Ver vídeo</button>
            </div>

            
            <!--ORDEN-->
            <div class="grupo-formulario">
                <label for="ordenEjercicio">Orden</label>
                <input type="number" id="ordenEjercicio" class="input-modal" placeholder="Ej: 1" min="1">
            </div>

            <!--NOTAS-->
            <div class="grupo-formulario">
                <label for="notasEjercicio">Notas</label>
                <textarea id="notasEjercicio" class="input-modal textarea-modal" placeholder="Opcional"></textarea>
            </div>

            <div class="modal-botones">
                <button id="btnCancelarEjercicio" class="boton-modal boton-modal-cancelar">Cancelar</button>
                <button id="btnGuardarEjercicio" class="boton-modal boton-modal-crear">Guardar</button>
            </div>

            <p id="mensajeModalEjercicio" class="mensaje-login"></p>
        </div>
    </div>

    <script type="module" src="../js/pages/entrenamiento.js"></script>
</body>
</html>
